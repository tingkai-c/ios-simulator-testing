name: Public runner preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install public tool
        run: bun install --cwd skills/ios-simulator-testing --frozen-lockfile
      - name: Prepare public XCTest tooling only
        env:
          AGENT_DEVICE_SESSION: public-preflight
          AGENT_DEVICE_NO_UPDATE_NOTIFIER: '1'
        run: |
          xcodebuild -version
          skills/ios-simulator-testing/node_modules/.bin/agent-device boot --platform ios --pick newest
          skills/ios-simulator-testing/node_modules/.bin/agent-device prepare ios-runner --platform ios --timeout 240000 --json
      - name: Stop simulators
        if: always()
        run: xcrun simctl shutdown all >/dev/null 2>&1 || true
