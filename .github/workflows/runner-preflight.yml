name: Public runner preflight
on:
  workflow_dispatch:
    inputs:
      recipient_key:
        description: Public RSA key for encrypted setup diagnostics
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install public tool
        run: bun install --cwd skills/ios-simulator-testing --frozen-lockfile
      - name: Prepare public XCTest tooling only
        timeout-minutes: 13
        env:
          AGENT_DEVICE_SESSION: public-preflight
          AGENT_DEVICE_NO_UPDATE_NOTIFIER: '1'
        run: |
          xcodebuild -version
          skills/ios-simulator-testing/node_modules/.bin/agent-device boot --platform ios --pick newest --timeout 300000
          skills/ios-simulator-testing/node_modules/.bin/agent-device prepare ios-runner --platform ios --timeout 480000 --json
      - name: Encrypt public-tool setup diagnostics
        if: always()
        env:
          RECIPIENT_KEY: ${{ inputs.recipient_key }}
        run: node tests/seal-preflight.mjs
      - name: Retain only encrypted setup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-preflight
          path: ${{ runner.temp }}/encrypted-preflight.json
          if-no-files-found: warn
          retention-days: 1
      - name: Stop simulators
        if: always()
        run: xcrun simctl shutdown all >/dev/null 2>&1 || true
