name: Build public simulator demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          architecture: arm64
      - name: Compile and package synthetic ARM64 simulator app
        run: node tests/build-demo.mjs
      - name: Publish only public demo app and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-demo
          path: |
            ${{ runner.temp }}/harness-demo.zip
            ${{ runner.temp }}/harness-demo.sha256
          if-no-files-found: error
          retention-days: 1
