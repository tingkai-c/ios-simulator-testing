name: Live iOS simulator
run-name: simulator-${{ inputs.session_id }}
on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Random session ID generated by the skill (no app/test names)
        type: string
        required: true
      recipient_key:
        description: Client RSA public key, base64 DER SPKI
        type: string
        required: true
      lifetime_minutes:
        description: Interactive lifetime from 5 to 30 minutes
        type: number
        default: 15
      runner:
        description: Standard macOS runner
        type: choice
        options:
          - macos-latest
          - xcode-27
        default: macos-latest
permissions:
  contents: read
concurrency:
  group: simulator-${{ inputs.session_id }}
  cancel-in-progress: false
jobs:
  session:
    runs-on: ${{ inputs.runner == 'xcode-27' && 'xcode-27' || 'macos-latest' }}
    timeout-minutes: 45
    env:
      SESSION_ID: ${{ inputs.session_id }}
      RECIPIENT_KEY: ${{ inputs.recipient_key }}
      SESSION_MINUTES: ${{ inputs.lifetime_minutes }}
      BOOTSTRAP_PATH: ${{ runner.temp }}/bootstrap/envelope.json
      HOST_EXIT_PATH: ${{ runner.temp }}/simulator-host-exit.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install public harness dependencies
        run: |
          bun install --cwd skills/ios-simulator-testing --frozen-lockfile
          brew install cloudflared
      - name: Prepare simulator and encrypted connection bundle
        timeout-minutes: 13
        shell: bash
        run: |
          umask 077
          nohup node host/host.mjs > "$RUNNER_TEMP/simulator-host-status.log" 2>&1 &
          echo "SIMULATOR_HOST_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 156); do
            if test -f "$BOOTSTRAP_PATH"; then
              echo 'Simulator ready. Connection credentials are encrypted to the client.'
              exit 0
            fi
            if test -f "$HOST_EXIT_PATH"; then
              echo 'Simulator setup failed. Sensitive host diagnostics were not published.'
              exit 1
            fi
            sleep 5
          done
          echo 'Simulator setup timed out.'
          exit 1
      - name: Publish only encrypted session bootstrap
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-${{ inputs.session_id }}
          path: ${{ runner.temp }}/bootstrap/envelope.json
          if-no-files-found: error
          retention-days: 1
      - name: Serve until stopped or expired
        timeout-minutes: 31
        shell: bash
        run: |
          while ! test -f "$HOST_EXIT_PATH"; do
            if ! kill -0 "$SIMULATOR_HOST_PID" 2>/dev/null; then
              echo 'Simulator host stopped unexpectedly.'
              exit 1
            fi
            sleep 5
          done
          node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(process.env.HOST_EXIT_PATH)); process.exit(result.ok ? 0 : 1)'
      - name: Stop host and simulator
        if: always()
        shell: bash
        run: |
          if test -n "${SIMULATOR_HOST_PID:-}"; then
            kill "$SIMULATOR_HOST_PID" 2>/dev/null || true
          fi
          xcrun simctl shutdown all >/dev/null 2>&1 || true
