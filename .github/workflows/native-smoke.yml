name: Synthetic native smoke
on:
  workflow_dispatch:
    inputs:
      recipient_key:
        description: Optional RSA public key for encrypted synthetic-test diagnostics
        type: string
        required: false
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install pinned public dependencies
        run: |
          bun install --cwd skills/ios-simulator-testing --frozen-lockfile
          brew install cloudflared
      - name: Exercise synthetic app, live tunnel, controls, and fixtures
        env:
          DIAGNOSTIC_RECIPIENT_KEY: ${{ inputs.recipient_key }}
        run: node tests/native-smoke.mjs
      - name: Publish only encrypted synthetic-test diagnostics
        if: ${{ failure() && inputs.recipient_key != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-synthetic-diagnostics
          path: ${{ runner.temp }}/encrypted-native-smoke.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Stop simulators
        if: always()
        run: xcrun simctl shutdown all >/dev/null 2>&1 || true
