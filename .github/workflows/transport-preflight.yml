name: Public transport preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: macos-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install public tunnel client
        run: brew install cloudflared
      - name: Test harmless HTTP endpoint with no simulator or credentials
        run: node tests/transport-preflight.mjs
